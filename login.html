<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Saka-Levo Hostel Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card narrow">
    <div class="brand">
      <span class="logo-mark" aria-label="Saka-Levo home">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.2 3 10.4v10.4h6.2v-6.1h5.6v6.1H21V10.4L12 3.2z"/></svg>
          <span class="logo-text">SL</span>
        </span>
      <h1>Saka-Levo Hostel</h1>
    </div>
    <p class="subtitle">Log in with your school email to continue.</p>

    <form action="user-dashboard.html" method="get">
      <div class="form-grid">
        <div class="field full">
          <label for="email">Email (school email)</label>
          <input type="email" id="email" name="email" placeholder="name@school.edu" required>
        </div>

        <div class="field full">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary btn-block">Login</button>

      </div>

      <div class="auth-links">
        <a href="#">Forgot password?</a><br><br>
        
      </div>
      <div class="muted">Create new account? <a href=" ">Sign Up?</a></div>
    </form>
  </main>
</body>
</html>
